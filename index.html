<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NURACOM Logo Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Arial', sans-serif;
  }
  .logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  canvas {
    display: block;
  }
  .text-container {
    display: flex;
    align-items: baseline;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .text-container.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .nura {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 8px;
    color: #c8c8c8;
    font-family: 'Segoe UI', 'Arial Black', sans-serif;
  }
  .com {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 8px;
    color: #ffffff;
    font-family: 'Segoe UI', 'Arial Black', sans-serif;
  }
  .reg {
    font-size: 18px;
    color: #ffffff;
    vertical-align: super;
    margin-left: 4px;
    font-weight: 400;
  }
</style>
</head>
<body>
<div class="logo-container">
  <canvas id="logoCanvas" width="500" height="500"></canvas>
  <div class="text-container" id="textContainer">
    <span class="nura">NURA</span><span class="com">COM</span><span class="reg">&reg;</span>
  </div>
</div>

<script>
const canvas = document.getElementById('logoCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const cx = W / 2;
const cy = H / 2;

// Colors matching the actual logo
const RED = '#be1e2d';      // Deep crimson red for outer dots
const RED2 = '#c4222f';     // Slightly lighter red
const ORANGE = '#e8651a';   // Warm orange
const ORANGE2 = '#ea7a22';  // Lighter orange
const ORANGE3 = '#e05a15';  // Darker orange
const GOLD = '#d4a017';     // Power icon color

// Each dot: [angle_degrees, radius_from_center, dot_radius, color]
// Carefully mapped from the logo close-up image
// The logo has dots arranged in radial spokes with size increasing outward
// Outer dots alternate red/orange, inner dots are all orange

const DEG = Math.PI / 180;

// Define all dots precisely to match the logo
// Format: { a: angle_deg, r: ring_radius, s: dot_size, c: color }
const dotDefs = [
  // === RING 1 (innermost) - 8 small orange dots ===
  { a: 0,   r: 42, s: 5.5, c: ORANGE2 },
  { a: 45,  r: 42, s: 5.0, c: ORANGE },
  { a: 90,  r: 42, s: 5.5, c: ORANGE2 },
  { a: 135, r: 42, s: 5.0, c: ORANGE },
  { a: 180, r: 42, s: 5.5, c: ORANGE2 },
  { a: 225, r: 42, s: 5.0, c: ORANGE },
  { a: 270, r: 42, s: 5.5, c: ORANGE2 },
  { a: 315, r: 42, s: 5.0, c: ORANGE },

  // === RING 2 - 12 dots, mix of sizes, mostly orange ===
  { a: 0,   r: 68, s: 8.0, c: ORANGE },
  { a: 30,  r: 68, s: 5.5, c: ORANGE3 },
  { a: 60,  r: 68, s: 8.0, c: ORANGE },
  { a: 90,  r: 68, s: 5.5, c: ORANGE2 },
  { a: 120, r: 68, s: 8.0, c: ORANGE },
  { a: 150, r: 68, s: 5.5, c: ORANGE3 },
  { a: 180, r: 68, s: 8.0, c: ORANGE },
  { a: 210, r: 68, s: 5.5, c: ORANGE3 },
  { a: 240, r: 68, s: 8.0, c: ORANGE },
  { a: 270, r: 68, s: 5.5, c: ORANGE2 },
  { a: 300, r: 68, s: 8.0, c: ORANGE },
  { a: 330, r: 68, s: 5.5, c: ORANGE3 },

  // === RING 3 - 16 dots, mix of orange and some red-orange ===
  { a: 0,    r: 98, s: 9.0,  c: ORANGE },
  { a: 22.5, r: 98, s: 5.0,  c: ORANGE3 },
  { a: 45,   r: 98, s: 9.0,  c: ORANGE },
  { a: 67.5, r: 98, s: 5.0,  c: ORANGE3 },
  { a: 90,   r: 98, s: 9.0,  c: ORANGE },
  { a: 112.5,r: 98, s: 5.0,  c: ORANGE3 },
  { a: 135,  r: 98, s: 9.0,  c: ORANGE },
  { a: 157.5,r: 98, s: 5.0,  c: ORANGE3 },
  { a: 180,  r: 98, s: 9.0,  c: ORANGE },
  { a: 202.5,r: 98, s: 5.0,  c: ORANGE3 },
  { a: 225,  r: 98, s: 9.0,  c: ORANGE },
  { a: 247.5,r: 98, s: 5.0,  c: ORANGE3 },
  { a: 270,  r: 98, s: 9.0,  c: ORANGE },
  { a: 292.5,r: 98, s: 5.0,  c: ORANGE3 },
  { a: 300,  r: 98, s: 9.0,  c: ORANGE },
  { a: 337.5,r: 98, s: 5.0,  c: ORANGE3 },

  // === RING 4 (outermost) - 12 large dots, alternating red and orange ===
  { a: 0,   r: 135, s: 13.0, c: ORANGE },   // 3 o'clock - orange
  { a: 30,  r: 135, s: 13.0, c: RED },       // red
  { a: 60,  r: 135, s: 13.0, c: RED },       // red
  { a: 90,  r: 135, s: 13.0, c: RED },       // 12 o'clock - red
  { a: 120, r: 135, s: 13.0, c: RED },       // red
  { a: 150, r: 135, s: 13.0, c: RED },       // red
  { a: 180, r: 135, s: 13.0, c: ORANGE },    // 9 o'clock - orange
  { a: 210, r: 135, s: 13.0, c: RED },       // red
  { a: 240, r: 135, s: 13.0, c: ORANGE },    // orange
  { a: 270, r: 135, s: 13.0, c: RED },       // 6 o'clock - red
  { a: 300, r: 135, s: 13.0, c: ORANGE },    // orange
  { a: 330, r: 135, s: 13.0, c: RED },       // red
];

// Precompute dot positions with animation data
const allDots = dotDefs.map((d, i) => {
  const angleRad = (d.a - 90) * DEG; // -90 so 0° = top
  const ringIndex = d.r < 50 ? 0 : d.r < 80 ? 1 : d.r < 110 ? 2 : 3;
  const spokeIndex = Math.round(d.a / 30);
  const delay = ringIndex * 350 + spokeIndex * 40;
  return {
    angle: angleRad,
    ringRadius: d.r,
    dotRadius: d.s,
    color: d.c,
    ringIndex,
    delay,
  };
});

// Animation timing
const DOT_APPEAR_DURATION = 500;
const POWER_ICON_DELAY = 1800;
const POWER_ICON_DURATION = 700;
const TEXT_DELAY = 2600;
const PULSE_SPEED = 2500;
const ROTATION_SPEED = 80000; // very slow rotation

let animStartTime = null;

function easeOutCubic(t) {
  return 1 - Math.pow(1 - Math.min(t, 1), 3);
}

function easeOutBack(t) {
  t = Math.min(t, 1);
  const c1 = 1.4;
  return 1 + (c1 + 1) * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

// Draw the brushstroke-style power icon
function drawPowerIcon(alpha, glowIntensity) {
  ctx.save();
  ctx.globalAlpha = alpha;

  const iconR = 22; // radius of the power circle
  const strokeW = 5;

  // Subtle glow
  ctx.shadowColor = '#e8b820';
  ctx.shadowBlur = 6 + glowIntensity * 8;

  // Draw the circle arc with a gradient for the brushstroke feel
  // The circle has a gap at the top and the stroke varies in width
  // We'll draw it as multiple small segments with varying width

  const segments = 40;
  const gapAngle = 0.7; // radians gap at top
  const startA = -Math.PI / 2 + gapAngle / 2;
  const endA = -Math.PI / 2 + Math.PI * 2 - gapAngle / 2;
  const totalArc = endA - startA;

  for (let i = 0; i < segments; i++) {
    const t1 = i / segments;
    const t2 = (i + 1) / segments;
    const a1 = startA + totalArc * t1;
    const a2 = startA + totalArc * t2;

    // Vary width along the stroke for brushstroke effect
    // Thicker at bottom, thinner near the gap
    const midT = (t1 + t2) / 2;
    const widthVar = 0.7 + 0.5 * Math.sin(midT * Math.PI); // wider in middle
    const w = strokeW * widthVar;

    // Color gradient: lighter gold at top-right, darker at bottom-left
    const colorT = midT;
    const r = Math.round(212 + colorT * 20);
    const g = Math.round(160 + (1 - colorT) * 30);
    const b = Math.round(23 + colorT * 10);

    ctx.beginPath();
    ctx.arc(cx, cy, iconR, a1, a2 + 0.03);
    ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Draw a second pass with slight offset for texture
  ctx.globalAlpha = alpha * 0.3;
  ctx.shadowBlur = 0;
  for (let i = 0; i < segments; i++) {
    const t1 = i / segments;
    const t2 = (i + 1) / segments;
    const a1 = startA + totalArc * t1;
    const a2 = startA + totalArc * t2;
    const midT = (t1 + t2) / 2;
    const widthVar = 0.5 + 0.3 * Math.sin(midT * Math.PI + 0.5);
    const w = strokeW * widthVar * 0.6;

    ctx.beginPath();
    ctx.arc(cx, cy, iconR + 1, a1, a2 + 0.03);
    ctx.strokeStyle = '#f0d040';
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Vertical line (power button top stroke)
  ctx.globalAlpha = alpha;
  ctx.shadowColor = '#e8b820';
  ctx.shadowBlur = 6 + glowIntensity * 8;

  // Main stroke - slightly tapered
  const lineTop = cy - iconR - 6;
  const lineBottom = cy - 4;
  const lineSegments = 12;
  for (let i = 0; i < lineSegments; i++) {
    const t1 = i / lineSegments;
    const t2 = (i + 1) / lineSegments;
    const y1 = lineTop + (lineBottom - lineTop) * t1;
    const y2 = lineTop + (lineBottom - lineTop) * t2;
    // Slightly wider in middle
    const midT = (t1 + t2) / 2;
    const w = strokeW * (0.75 + 0.4 * Math.sin(midT * Math.PI));

    const r = Math.round(220 + midT * 15);
    const g = Math.round(175 - midT * 20);
    const b = Math.round(20 + midT * 10);

    ctx.beginPath();
    ctx.moveTo(cx, y1);
    ctx.lineTo(cx, y2 + 1);
    ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Texture overlay on the line
  ctx.globalAlpha = alpha * 0.25;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.moveTo(cx + 0.8, lineTop + 2);
  ctx.lineTo(cx + 0.8, lineBottom - 1);
  ctx.strokeStyle = '#f0d040';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.restore();
}

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16),
  };
}

function animate(timestamp) {
  if (!animStartTime) animStartTime = timestamp;
  const elapsed = timestamp - animStartTime;

  ctx.clearRect(0, 0, W, H);

  // Very slow rotation
  const rotAngle = (elapsed / ROTATION_SPEED) * 2 * Math.PI;

  // Draw all dots
  allDots.forEach(dot => {
    const dotElapsed = elapsed - dot.delay;
    if (dotElapsed <= 0) return;

    // Fade + scale in
    const fadeT = Math.min(dotElapsed / DOT_APPEAR_DURATION, 1);
    const alpha = easeOutCubic(fadeT);
    const scale = easeOutBack(fadeT);

    // Breathing pulse after entrance
    let breathScale = 1;
    if (fadeT >= 1) {
      const breathElapsed = elapsed - dot.delay - DOT_APPEAR_DURATION;
      const phase = (breathElapsed + dot.ringIndex * 400) / PULSE_SPEED;
      breathScale = 1 + 0.06 * Math.sin(phase * 2 * Math.PI);
    }

    // Apply very slow rotation (outer rings rotate slightly faster)
    const rotOffset = rotAngle * (0.2 + dot.ringIndex * 0.1);
    const angle = dot.angle + rotOffset;
    const x = cx + Math.cos(angle) * dot.ringRadius;
    const y = cy + Math.sin(angle) * dot.ringRadius;
    const r = dot.dotRadius * scale * breathScale;

    const { r: cr, g: cg, b: cb } = hexToRgb(dot.color);

    // Draw dot with subtle 3D shading
    ctx.save();
    ctx.globalAlpha = alpha;

    // Radial gradient for depth
    const grad = ctx.createRadialGradient(
      x - r * 0.25, y - r * 0.25, r * 0.1,
      x, y, r
    );
    grad.addColorStop(0, `rgb(${Math.min(cr + 40, 255)}, ${Math.min(cg + 30, 255)}, ${Math.min(cb + 20, 255)})`);
    grad.addColorStop(0.6, dot.color);
    grad.addColorStop(1, `rgb(${Math.max(cr - 25, 0)}, ${Math.max(cg - 15, 0)}, ${Math.max(cb - 10, 0)})`);

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
  });

  // Power icon
  const powerElapsed = elapsed - POWER_ICON_DELAY;
  if (powerElapsed > 0) {
    const powerAlpha = easeOutCubic(powerElapsed / POWER_ICON_DURATION);
    const glowPhase = Math.max(0, (elapsed - POWER_ICON_DELAY - POWER_ICON_DURATION) / PULSE_SPEED);
    const glowIntensity = (Math.sin(glowPhase * 2 * Math.PI) + 1) / 2;
    drawPowerIcon(Math.min(powerAlpha, 1), glowIntensity);
  }

  // Text
  if (elapsed > TEXT_DELAY) {
    document.getElementById('textContainer').classList.add('visible');
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
