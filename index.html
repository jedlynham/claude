<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NURACOM Logo Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
  }
  canvas { display: block; }
  .text-container {
    display: flex;
    align-items: baseline;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .text-container.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .nura {
    font-size: 60px;
    font-weight: 700;
    letter-spacing: 12px;
    color: #ffffff;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  .com {
    font-size: 60px;
    font-weight: 300;
    letter-spacing: 6px;
    color: #ffffff;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  .reg {
    font-size: 16px;
    color: #ffffff;
    vertical-align: super;
    margin-left: 2px;
    font-weight: 300;
  }
</style>
</head>
<body>
<div class="logo-container">
  <canvas id="logoCanvas" width="500" height="500"></canvas>
  <div class="text-container" id="textContainer">
    <span class="nura">NURA</span><span class="com">COM</span><span class="reg">&reg;</span>
  </div>
</div>

<script>
const canvas = document.getElementById('logoCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const cx = W / 2;
const cy = H / 2;

const DEG = Math.PI / 180;

// Exact colors from the logo
const RED   = '#be1e2d';
const ORNG  = '#e8651a';

// 3 rings matched exactly from reference image:
// Ring 1 (inner):  10 small orange dots
// Ring 2 (middle): 14 medium orange dots
// Ring 3 (outer):  12 large dots - R,R,O,O,R,R,R,R,O,O,R,R

const dots = [
  // ===== RING 1 (inner): 10 small orange dots, 36° apart =====
  [0,    48, 5.5, ORNG],
  [36,   48, 5.5, ORNG],
  [72,   48, 5.5, ORNG],
  [108,  48, 5.5, ORNG],
  [144,  48, 5.5, ORNG],
  [180,  48, 5.5, ORNG],
  [216,  48, 5.5, ORNG],
  [252,  48, 5.5, ORNG],
  [288,  48, 5.5, ORNG],
  [324,  48, 5.5, ORNG],

  // ===== RING 2 (middle): 14 medium orange dots, ~25.7° apart =====
  [0,      85, 8, ORNG],
  [25.7,   85, 8, ORNG],
  [51.4,   85, 8, ORNG],
  [77.1,   85, 8, ORNG],
  [102.9,  85, 8, ORNG],
  [128.6,  85, 8, ORNG],
  [154.3,  85, 8, ORNG],
  [180,    85, 8, ORNG],
  [205.7,  85, 8, ORNG],
  [231.4,  85, 8, ORNG],
  [257.1,  85, 8, ORNG],
  [282.9,  85, 8, ORNG],
  [308.6,  85, 8, ORNG],
  [334.3,  85, 8, ORNG],

  // ===== RING 3 (outer): 12 large dots, 30° apart =====
  // Pattern: R R O O R R R R O O R R
  [0,    125, 14, RED],
  [30,   125, 14, RED],
  [60,   125, 14, ORNG],
  [90,   125, 14, ORNG],
  [120,  125, 14, RED],
  [150,  125, 14, RED],
  [180,  125, 14, RED],
  [210,  125, 14, RED],
  [240,  125, 14, ORNG],
  [270,  125, 14, ORNG],
  [300,  125, 14, RED],
  [330,  125, 14, RED],
];

// Build dot objects
const allDots = dots.map(([aDeg, rr, dr, color]) => {
  const angle = (aDeg - 90) * DEG; // convert: 0°=top → standard math angle
  const ringIdx = rr < 60 ? 0 : rr < 110 ? 1 : 2;
  const spokeIdx = Math.round(aDeg / 22.5);
  const delay = ringIdx * 300 + spokeIdx * 35;
  return { angle, ringRadius: rr, dotRadius: dr, color, ringIdx, delay };
});

// Animation config
const DOT_APPEAR = 450;
const POWER_DELAY = 1600;
const POWER_DURATION = 600;
const TEXT_DELAY = 2200;
const PULSE_SPEED = 2800;
const ROT_SPEED = 90000;

let t0 = null;

function easeOut(t) { t = Math.min(t, 1); return 1 - (1 - t) * (1 - t) * (1 - t); }
function easeOutBack(t) {
  t = Math.min(t, 1);
  const c = 1.3;
  return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
}


function drawPowerIcon(alpha, glow) {
  ctx.save();
  ctx.globalAlpha = alpha;

  const r = 20;
  const lw = 4.5;
  const gap = 0.65; // gap at top in radians

  // Glow
  ctx.shadowColor = '#e8b820';
  ctx.shadowBlur = 4 + glow * 6;

  // Circle arc
  const startA = -Math.PI / 2 + gap / 2;
  const endA = -Math.PI / 2 + Math.PI * 2 - gap / 2;

  // Draw with gradient along the arc for the golden look
  // Main arc stroke
  ctx.beginPath();
  ctx.arc(cx, cy, r, startA, endA);
  ctx.strokeStyle = '#d4a020';
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Lighter highlight on top-right portion
  ctx.globalAlpha = alpha * 0.4;
  ctx.beginPath();
  ctx.arc(cx, cy, r, startA, startA + 1.2);
  ctx.strokeStyle = '#f0d040';
  ctx.lineWidth = lw * 0.7;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Vertical line
  ctx.globalAlpha = alpha;
  ctx.shadowBlur = 4 + glow * 6;
  ctx.beginPath();
  ctx.moveTo(cx, cy - r - 5);
  ctx.lineTo(cx, cy - 3);
  ctx.strokeStyle = '#d4a020';
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Highlight on line
  ctx.globalAlpha = alpha * 0.35;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.moveTo(cx + 0.5, cy - r - 4);
  ctx.lineTo(cx + 0.5, cy - 5);
  ctx.strokeStyle = '#f0d040';
  ctx.lineWidth = lw * 0.5;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.restore();
}

function frame(ts) {
  if (!t0) t0 = ts;
  const el = ts - t0;
  ctx.clearRect(0, 0, W, H);

  const rot = (el / ROT_SPEED) * Math.PI * 2;

  // Draw dots
  for (const d of allDots) {
    const de = el - d.delay;
    if (de <= 0) continue;

    const fadeT = Math.min(de / DOT_APPEAR, 1);
    const alpha = easeOut(fadeT);
    const scale = easeOutBack(fadeT);

    // Gentle breathing after entrance
    let breath = 1;
    if (fadeT >= 1) {
      const be = el - d.delay - DOT_APPEAR;
      breath = 1 + 0.05 * Math.sin((be + d.ringIdx * 350) / PULSE_SPEED * Math.PI * 2);
    }

    // Very slow per-ring rotation
    const a = d.angle + rot * (0.15 + d.ringIdx * 0.08);
    const x = cx + Math.cos(a) * d.ringRadius;
    const y = cy + Math.sin(a) * d.ringRadius;
    const rd = d.dotRadius * scale * breath;

    ctx.save();
    ctx.globalAlpha = alpha;

    // Flat solid dot
    ctx.beginPath();
    ctx.arc(x, y, rd, 0, Math.PI * 2);
    ctx.fillStyle = d.color;
    ctx.fill();
    ctx.restore();
  }

  // Power icon
  const pe = el - POWER_DELAY;
  if (pe > 0) {
    const pa = Math.min(easeOut(pe / POWER_DURATION), 1);
    const gp = Math.max(0, (el - POWER_DELAY - POWER_DURATION) / PULSE_SPEED);
    const gi = (Math.sin(gp * Math.PI * 2) + 1) / 2;
    drawPowerIcon(pa, gi);
  }

  // Text
  if (el > TEXT_DELAY) {
    document.getElementById('textContainer').classList.add('visible');
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
