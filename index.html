<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NURACOM Logo Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
  }
  canvas { display: block; }
  .text-container {
    display: flex;
    align-items: baseline;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .text-container.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .nura {
    font-size: 60px;
    font-weight: 300;
    letter-spacing: 12px;
    color: #ffffff;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  .com {
    font-size: 60px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #ffffff;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  .reg {
    font-size: 16px;
    color: #ffffff;
    vertical-align: super;
    margin-left: 2px;
    font-weight: 300;
  }
</style>
</head>
<body>
<div class="logo-container">
  <canvas id="logoCanvas" width="500" height="500"></canvas>
  <div class="text-container" id="textContainer">
    <span class="nura">NURA</span><span class="com">COM</span><span class="reg">&reg;</span>
  </div>
</div>

<script>
const canvas = document.getElementById('logoCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const cx = W / 2;
const cy = H / 2;

const DEG = Math.PI / 180;

// Exact colors from the logo
const RED   = '#be1e2d';
const ORNG  = '#e8651a';
const ORNG2 = '#ea7020'; // slightly lighter orange for variation

// Dot definitions: angle is clockwise from 12 o'clock (top)
// [angle_deg, ring_radius, dot_radius, color]
//
// Carefully mapped from the reference images:
// - Ring 4 (outer): 12 large dots, pattern R R O O R R R R O O R R
// - Ring 3: 16 dots alternating large/small, mostly orange
// - Ring 2: 12 dots alternating large/small, all orange
// - Ring 1 (inner): 8 small dots, all orange

const dots = [
  // ===== RING 1 (innermost): 8 small orange dots, 45° apart =====
  [0,    40, 4.5, ORNG2],
  [45,   40, 4.5, ORNG],
  [90,   40, 4.5, ORNG2],
  [135,  40, 4.5, ORNG],
  [180,  40, 4.5, ORNG2],
  [225,  40, 4.5, ORNG],
  [270,  40, 4.5, ORNG2],
  [315,  40, 4.5, ORNG],

  // ===== RING 2: 12 dots, 30° apart, alternating large(8)/small(5) =====
  [0,    66, 8,   ORNG],
  [30,   66, 5,   ORNG2],
  [60,   66, 8,   ORNG],
  [90,   66, 5,   ORNG2],
  [120,  66, 8,   ORNG],
  [150,  66, 5,   ORNG2],
  [180,  66, 8,   ORNG],
  [210,  66, 5,   ORNG2],
  [240,  66, 8,   ORNG],
  [270,  66, 5,   ORNG2],
  [300,  66, 8,   ORNG],
  [330,  66, 5,   ORNG2],

  // ===== RING 3: 16 dots, 22.5° apart, alternating large(9)/small(5) =====
  [0,     96, 9,   ORNG],
  [22.5,  96, 5,   ORNG2],
  [45,    96, 9,   ORNG],
  [67.5,  96, 5,   ORNG2],
  [90,    96, 9,   ORNG],
  [112.5, 96, 5,   ORNG2],
  [135,   96, 9,   ORNG],
  [157.5, 96, 5,   ORNG2],
  [180,   96, 9,   ORNG],
  [202.5, 96, 5,   ORNG2],
  [225,   96, 9,   ORNG],
  [247.5, 96, 5,   ORNG2],
  [270,   96, 9,   ORNG],
  [292.5, 96, 5,   ORNG2],
  [315,   96, 9,   ORNG],
  [337.5, 96, 5,   ORNG2],

  // ===== RING 4 (outermost): 12 large dots, 30° apart =====
  // Pattern clockwise from top: R R O O R R R R O O R R
  [0,    132, 13, RED],
  [30,   132, 13, RED],
  [60,   132, 13, ORNG],
  [90,   132, 13, ORNG],
  [120,  132, 13, RED],
  [150,  132, 13, RED],
  [180,  132, 13, RED],
  [210,  132, 13, RED],
  [240,  132, 13, ORNG],
  [270,  132, 13, ORNG],
  [300,  132, 13, RED],
  [330,  132, 13, RED],
];

// Build dot objects
const allDots = dots.map(([aDeg, rr, dr, color]) => {
  const angle = (aDeg - 90) * DEG; // convert: 0°=top → standard math angle
  const ringIdx = rr < 50 ? 0 : rr < 80 ? 1 : rr < 110 ? 2 : 3;
  const spokeIdx = Math.round(aDeg / 22.5);
  const delay = ringIdx * 300 + spokeIdx * 35;
  return { angle, ringRadius: rr, dotRadius: dr, color, ringIdx, delay };
});

// Animation config
const DOT_APPEAR = 450;
const POWER_DELAY = 1600;
const POWER_DURATION = 600;
const TEXT_DELAY = 2200;
const PULSE_SPEED = 2800;
const ROT_SPEED = 90000;

let t0 = null;

function easeOut(t) { t = Math.min(t, 1); return 1 - (1 - t) * (1 - t) * (1 - t); }
function easeOutBack(t) {
  t = Math.min(t, 1);
  const c = 1.3;
  return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
}

function hexRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

function drawPowerIcon(alpha, glow) {
  ctx.save();
  ctx.globalAlpha = alpha;

  const r = 20;
  const lw = 4.5;
  const gap = 0.65; // gap at top in radians

  // Glow
  ctx.shadowColor = '#e8b820';
  ctx.shadowBlur = 4 + glow * 6;

  // Circle arc
  const startA = -Math.PI / 2 + gap / 2;
  const endA = -Math.PI / 2 + Math.PI * 2 - gap / 2;

  // Draw with gradient along the arc for the golden look
  // Main arc stroke
  ctx.beginPath();
  ctx.arc(cx, cy, r, startA, endA);
  ctx.strokeStyle = '#d4a020';
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Lighter highlight on top-right portion
  ctx.globalAlpha = alpha * 0.4;
  ctx.beginPath();
  ctx.arc(cx, cy, r, startA, startA + 1.2);
  ctx.strokeStyle = '#f0d040';
  ctx.lineWidth = lw * 0.7;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Vertical line
  ctx.globalAlpha = alpha;
  ctx.shadowBlur = 4 + glow * 6;
  ctx.beginPath();
  ctx.moveTo(cx, cy - r - 5);
  ctx.lineTo(cx, cy - 3);
  ctx.strokeStyle = '#d4a020';
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Highlight on line
  ctx.globalAlpha = alpha * 0.35;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.moveTo(cx + 0.5, cy - r - 4);
  ctx.lineTo(cx + 0.5, cy - 5);
  ctx.strokeStyle = '#f0d040';
  ctx.lineWidth = lw * 0.5;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.restore();
}

function frame(ts) {
  if (!t0) t0 = ts;
  const el = ts - t0;
  ctx.clearRect(0, 0, W, H);

  const rot = (el / ROT_SPEED) * Math.PI * 2;

  // Draw dots
  for (const d of allDots) {
    const de = el - d.delay;
    if (de <= 0) continue;

    const fadeT = Math.min(de / DOT_APPEAR, 1);
    const alpha = easeOut(fadeT);
    const scale = easeOutBack(fadeT);

    // Gentle breathing after entrance
    let breath = 1;
    if (fadeT >= 1) {
      const be = el - d.delay - DOT_APPEAR;
      breath = 1 + 0.05 * Math.sin((be + d.ringIdx * 350) / PULSE_SPEED * Math.PI * 2);
    }

    // Very slow per-ring rotation
    const a = d.angle + rot * (0.15 + d.ringIdx * 0.08);
    const x = cx + Math.cos(a) * d.ringRadius;
    const y = cy + Math.sin(a) * d.ringRadius;
    const rd = d.dotRadius * scale * breath;

    const [cr, cg, cb] = hexRgb(d.color);

    ctx.save();
    ctx.globalAlpha = alpha;

    // 3D shaded dot
    const g = ctx.createRadialGradient(x - rd * 0.3, y - rd * 0.3, rd * 0.05, x, y, rd);
    g.addColorStop(0, `rgb(${Math.min(cr+50,255)},${Math.min(cg+35,255)},${Math.min(cb+25,255)})`);
    g.addColorStop(0.55, d.color);
    g.addColorStop(1, `rgb(${Math.max(cr-35,0)},${Math.max(cg-20,0)},${Math.max(cb-15,0)})`);

    ctx.beginPath();
    ctx.arc(x, y, rd, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  }

  // Power icon
  const pe = el - POWER_DELAY;
  if (pe > 0) {
    const pa = Math.min(easeOut(pe / POWER_DURATION), 1);
    const gp = Math.max(0, (el - POWER_DELAY - POWER_DURATION) / PULSE_SPEED);
    const gi = (Math.sin(gp * Math.PI * 2) + 1) / 2;
    drawPowerIcon(pa, gi);
  }

  // Text
  if (el > TEXT_DELAY) {
    document.getElementById('textContainer').classList.add('visible');
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
