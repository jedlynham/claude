<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NURACOM Logo Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Arial', sans-serif;
  }
  .logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  canvas {
    display: block;
  }
  .text-container {
    display: flex;
    align-items: baseline;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .text-container.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .nura {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 8px;
    color: #c8c8c8;
    font-family: 'Segoe UI', 'Arial Black', sans-serif;
  }
  .com {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 8px;
    color: #ffffff;
    font-family: 'Segoe UI', 'Arial Black', sans-serif;
  }
  .reg {
    font-size: 18px;
    color: #ffffff;
    vertical-align: super;
    margin-left: 4px;
    font-weight: 400;
  }
</style>
</head>
<body>
<div class="logo-container">
  <canvas id="logoCanvas" width="400" height="400"></canvas>
  <div class="text-container" id="textContainer">
    <span class="nura">NURA</span><span class="com">COM</span><span class="reg">&reg;</span>
  </div>
</div>

<script>
const canvas = document.getElementById('logoCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const cx = W / 2;
const cy = H / 2;

// Define dot rings from inside out
// Each ring: { radius, count, startAngle, dotRadius, colors }
const rings = [];

// Ring 1 (innermost) - small orange dots
rings.push({
  radius: 38,
  count: 8,
  startAngle: Math.PI / 8,
  dotRadius: 5,
  colors: ['#e8750a', '#d4600a', '#f08a20', '#e06a10', '#d45a08', '#f09030', '#e07518', '#d86010']
});

// Ring 2
rings.push({
  radius: 62,
  count: 12,
  startAngle: 0,
  dotRadius: 6.5,
  colors: ['#e87010', '#c84020', '#f08820', '#d85818', '#c03818', '#e87818', '#d04a18', '#f09028', '#d86818', '#c84420', '#e87a18', '#d05020']
});

// Ring 3
rings.push({
  radius: 88,
  count: 16,
  startAngle: Math.PI / 16,
  dotRadius: 7.5,
  colors: ['#d85010', '#b82818', '#e06818', '#c84018', '#a82018', '#d85818', '#be3018', '#e87020', '#d04a10', '#b42418', '#d86018', '#c43818', '#a81c18', '#d45018', '#bc2c18', '#e46820']
});

// Ring 4 (outermost) - larger red/dark dots
rings.push({
  radius: 116,
  count: 20,
  startAngle: 0,
  dotRadius: 8,
  colors: ['#c03010', '#981818', '#d84818', '#b42818', '#901210', '#c43810', '#a02018', '#d85020', '#bc3010', '#941418', '#c84018', '#a82418', '#8c1010', '#c03410', '#9c1c18', '#d44a18', '#b82c18', '#921218', '#c43c10', '#a42218']
});

// Animation state
let animStartTime = null;
const DOT_APPEAR_DURATION = 600;    // ms per dot fade-in
const RING_STAGGER = 400;           // ms between ring starts
const DOT_STAGGER = 50;             // ms between dots in same ring
const POWER_ICON_DELAY = 2000;      // ms before power icon appears
const POWER_ICON_DURATION = 800;
const TEXT_DELAY = 2800;
const PULSE_SPEED = 2000;           // ms per pulse cycle
const ROTATION_SPEED = 60000;       // ms per full rotation

// Precompute dot positions
const allDots = [];
rings.forEach((ring, ri) => {
  for (let i = 0; i < ring.count; i++) {
    const angle = ring.startAngle + (2 * Math.PI * i) / ring.count;
    const x = cx + Math.cos(angle) * ring.radius;
    const y = cy + Math.sin(angle) * ring.radius;
    const delay = ri * RING_STAGGER + i * DOT_STAGGER;
    allDots.push({
      x, y,
      baseX: Math.cos(angle) * ring.radius,
      baseY: Math.sin(angle) * ring.radius,
      radius: ring.dotRadius,
      color: ring.colors[i % ring.colors.length],
      delay,
      ringIndex: ri,
      angle,
      ringRadius: ring.radius,
    });
  }
});

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
}

function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function easeInOutSine(t) {
  return -(Math.cos(Math.PI * t) - 1) / 2;
}

function drawPowerIcon(alpha, glowIntensity) {
  ctx.save();
  ctx.globalAlpha = alpha;

  // Glow effect
  const glowSize = 8 + glowIntensity * 4;
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = glowSize;

  // Circle arc (power symbol outer ring)
  ctx.beginPath();
  ctx.arc(cx, cy, 16, -Math.PI * 0.7, Math.PI * 1.7, false);
  ctx.strokeStyle = '#f0c800';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Vertical line (power symbol top bar)
  ctx.beginPath();
  ctx.moveTo(cx, cy - 20);
  ctx.lineTo(cx, cy - 6);
  ctx.strokeStyle = '#f0c800';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.restore();
}

function animate(timestamp) {
  if (!animStartTime) animStartTime = timestamp;
  const elapsed = timestamp - animStartTime;

  ctx.clearRect(0, 0, W, H);

  // Slow rotation angle for the entire dot pattern
  const rotationAngle = (elapsed / ROTATION_SPEED) * 2 * Math.PI;

  // Draw dots
  allDots.forEach(dot => {
    const dotElapsed = elapsed - dot.delay;
    if (dotElapsed <= 0) return;

    // Fade in
    const fadeProgress = Math.min(dotElapsed / DOT_APPEAR_DURATION, 1);
    const alpha = easeOutCubic(fadeProgress);

    // Scale pop-in effect
    const scaleProgress = Math.min(dotElapsed / (DOT_APPEAR_DURATION * 0.7), 1);
    let scale = easeOutCubic(scaleProgress);
    if (scaleProgress < 1) {
      scale = scale * 1.2 - 0.2 * easeOutCubic(scaleProgress);
    }

    // Breathing pulse (starts after initial animation)
    const breathDelay = dot.delay + DOT_APPEAR_DURATION;
    let breathScale = 1;
    if (elapsed > breathDelay) {
      const breathElapsed = elapsed - breathDelay;
      const breathPhase = (breathElapsed + dot.ringIndex * 300) / PULSE_SPEED;
      breathScale = 1 + 0.08 * Math.sin(breathPhase * 2 * Math.PI);
    }

    // Apply rotation
    const rotatedAngle = dot.angle + rotationAngle * (0.3 + dot.ringIndex * 0.15);
    const x = cx + Math.cos(rotatedAngle) * dot.ringRadius;
    const y = cy + Math.sin(rotatedAngle) * dot.ringRadius;

    const r = dot.radius * scale * breathScale;
    const { r: cr, g: cg, b: cb } = hexToRgb(dot.color);

    // Subtle glow
    ctx.save();
    ctx.globalAlpha = alpha * 0.3;
    ctx.shadowColor = dot.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = dot.color;
    ctx.fill();
    ctx.restore();

    // Main dot
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);

    // Radial gradient for 3D look
    const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
    grad.addColorStop(0, `rgba(${Math.min(cr + 60, 255)}, ${Math.min(cg + 40, 255)}, ${Math.min(cb + 30, 255)}, 1)`);
    grad.addColorStop(0.7, dot.color);
    grad.addColorStop(1, `rgba(${Math.max(cr - 30, 0)}, ${Math.max(cg - 20, 0)}, ${Math.max(cb - 15, 0)}, 1)`);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
  });

  // Power icon
  const powerElapsed = elapsed - POWER_ICON_DELAY;
  if (powerElapsed > 0) {
    const powerAlpha = Math.min(powerElapsed / POWER_ICON_DURATION, 1);
    const glowPhase = Math.max(0, (elapsed - POWER_ICON_DELAY - POWER_ICON_DURATION) / PULSE_SPEED);
    const glowIntensity = easeInOutSine((Math.sin(glowPhase * 2 * Math.PI) + 1) / 2);
    drawPowerIcon(easeOutCubic(powerAlpha), glowIntensity);
  }

  // Show text
  if (elapsed > TEXT_DELAY) {
    document.getElementById('textContainer').classList.add('visible');
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
